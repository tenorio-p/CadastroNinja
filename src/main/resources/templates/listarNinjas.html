<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding:50px;
        }

        .container{
            width:95%;
            max-width:1200px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#1e293b;
            font-size:2rem;
            font-weight:700;
        }

        /* ===================== */
        /* TABELA */
        /* ===================== */

        .ninja-table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:12px;
        }

        .ninja-table thead{
            background:#2563eb;
            color:white;
        }

        .ninja-table thead th{
            padding:18px;
            text-align:left;
            font-size:15px;
            letter-spacing:.5px;
        }

        .ninja-table tbody tr{
            transition:.25s;
        }

        .ninja-table tbody tr:nth-child(even){
            background:#f8fafc;
        }

        .ninja-table tbody tr:hover{
            background:#dbeafe;
            transform:scale(1.01);
        }

        .ninja-table td{
            padding:18px;
            border-bottom:1px solid #e5e7eb;
        }

        /* ===================== */
        /* RANK */
        /* ===================== */

        .rank{
            display:inline-block;
            background:#22c55e;
            color:white;
            padding:6px 12px;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
        }

        /* ===================== */
        /* MISSÃO */
        /* ===================== */

        .sem-missao{
            color:#ef4444;
            font-weight:600;
        }

        /* ===================== */
        /* BOTÕES */
        /* ===================== */

        .acoes{
            white-space:nowrap;
        }

        .btn{
            text-decoration:none;
            color:white;
            padding:8px 15px;
            border-radius:8px;
            font-size:14px;
            margin-right:8px;
            transition:.3s;
            display:inline-block;
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 6px 15px rgba(0,0,0,.2);
        }

        .detalhes{
            background:#3b82f6;
        }

        .detalhes:hover{
            background:#2563eb;
        }

        .editar{
            background:#f59e0b;
        }

        .editar:hover{
            background:#d97706;
        }

        .deletar{
            background:#ef4444;
        }

        .deletar:hover{
            background:#dc2626;
        }

        /* ===================== */
        /* RESPONSIVO */
        /* ===================== */

        @media(max-width:900px){

            .container{
                overflow-x:auto;
            }

            .ninja-table{
                min-width:900px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <h1>🥷 Tabela de Ninjas</h1>

    <table class="ninja-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Email</th>
            <th>Rank</th>
            <th>Missão</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ninja : ${ninjas}">
            <td th:text="${ninja.id}"></td>
            <td th:text="${ninja.nome}"></td>
            <td th:text="${ninja.idade}"></td>
            <td th:text="${ninja.email}"></td>
            <td>
                <span class="rank" th:text="${ninja.rank}"></span>
            </td>

            <td>
                <span th:if="${ninja.missoes}"><span th:text="${ninja.missoes.nomeMissao}"></span></span>
                <span class="sem-missao"
                      th:if="${ninja.missoes == null}">
                    Nenhuma missão
                </span>
            </td>

            <td class="acoes">
                <a class="btn deletar"
                   th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}">
                    Deletar
                </a>
            </td>

        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
